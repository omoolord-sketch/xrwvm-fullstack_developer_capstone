apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: dealership
  name: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      run: dealership
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: dealership
    spec:
      containers:
      - image: us.icr.io/sn-labs-omoolord/dealership:latest
        imagePullPolicy: Always
        name: dealership
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: backend_url
          value: "https://omoolord-3030.theiadockernext-0-labs-prod-theiak8s-4-tor01.proxy.cognitiveclass.ai"
        - name: sentiment_analyzer_url
          value: "https://sentianalyzer.2hn8ew5l4jjf.us-south.codeengine.appdomain.cloud/"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: dealership
  labels:
    run: dealership
spec:
  selector:
    run: dealership
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
